# apps.yaml
# One top-level entry per app. Only `id`, `name`, `summary`, `categories` and at
# least one `releases` entry are required; everything else has sane defaults.
#
# To install via Nextcloud, each release must be signed and the app needs a
# `certificate` (the public code-signing certificate issued for the app id).
# If you have the release archive + private key locally you can set `file` and
# `key` and run `python3 build.py --key app.key -k` to auto-compute the
# signature and sha256 digest instead of filling them in by hand.

- id: demoapp
  name: Demo App
  summary: A tiny app to prove the static store works.
  description: |
    Demo App is a minimal Nextcloud application used to test self-hosted,
    statically served app stores. It ships a settings section and does nothing
    else, but the release pipeline demonstrates signing and versioning.
  certificate: ""
  authors:
    - name: Muhammed
      mail: muhammed@example.com
      homepage: https://example.com
  categories: [tools]
  website: https://example.com/demoapp
  docs:
    admin: https://example.com/demoapp/admin
    user: https://example.com/demoapp/user
    developer: https://example.com/demoapp/dev
  discussion: https://github.com/example/demoapp/discussions
  issueTracker: https://github.com/example/demoapp/issues
  screenshots:
    - url: https://example.com/demoapp/main.png
      smallThumbnail: https://example.com/demoapp/main-thumb.png
  isFeatured: false
  ratingRecent: 4.5
  ratingOverall: 4.8
  ratingNumRecent: 12
  ratingNumOverall: 240
  releases:
    - version: 0.4.2
      phpVersionSpec: ">= 8.0"
      platformVersionSpec: ">= 24, <= 30"
      isNightly: false
      download: https://github.com/example/demoapp/releases/download/v0.4.2/demoapp-0.4.2.tar.gz
      # file: ./dist/demoapp-0.4.2.tar.gz   # local archive -> auto signature
      # key:  ./dist/demoapp.key            # or use --key on the CLI
      signature: ""
      changelog: |
        - Fix crash when saving empty settings
        - Drop support for Nextcloud < 24
    - version: 0.4.1
      phpVersionSpec: ">= 7.4"
      platformVersionSpec: ">= 20, <= 29"
      isNightly: false
      download: https://github.com/example/demoapp/releases/download/v0.4.1/demoapp-0.4.1.tar.gz
      signature: ""
      changelog: |
        - Initial public release