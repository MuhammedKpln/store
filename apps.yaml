# apps.yaml
# One top-level entry per app. Only `id`, `name`, `summary`, `categories` and at
# least one `releases` entry are required; everything else has sane defaults.
#
# To install via Nextcloud, each release must be signed and the app needs a
# `certificate` (the public code-signing certificate issued for the app id).
# If you have the release archive + private key locally you can set `file` and
# `key` and run `python3 build.py --key app.key` to auto-compute the signature.

- id: televisorium
  name: Televisorium
  summary: An app to keep track of your watchlist, tv series, movies. Similar to trakt.tv
  description: |
    A Nextcloud app to keep track of your movies, TV shows and watchlist. Similar
    to trakt.tv.

    Features:
    - Add movies and TV shows to your library from The Movie Database (TMDb)
    - Organize titles into Watchlist, Watching, Watched, On hold and Dropped
    - Browse your library by status or media type (movies, TV shows)
    - Search titles in your library
    - Watch progress tracking per title with auto status updates
    - Episode tracking for TV shows, grouped by season
    - Import all episodes of a season from TMDb
    - Personal ratings per title
    - Per-user metadata language and API key for TMDb
  certificate: ""
  authors:
    - name: Muhammed Kaplan
      mail: mmuhammedkaplan0@gmail.com
      homepage: https://github.com/muhammedkpln
  categories: [multimedia]
  website: https://github.com/MuhammedKpln/televisorium
  docs:
    admin: https://github.com/MuhammedKpln/televisorium#readme
    user: https://github.com/MuhammedKpln/televisorium#usage
    developer: ""
  discussion: ""
  issueTracker: https://github.com/MuhammedKpln/televisorium/issues
  isFeatured: false
  ratingRecent: 0.0
  ratingOverall: 0.0
  ratingNumRecent: 0
  ratingNumOverall: 0
  releases:
    - version: 1.1.0
      phpVersionSpec: ">= 8.1"
      platformVersionSpec: ">= 31, <= 36"
      isNightly: false
      download: https://github.com/MuhammedKpln/televisorium/releases/download/1.1.0/televisorium-1.1.0.tar.gz
      file: ./dist/televisorium-1.1.0.tar.gz   # local archive -> auto signature
      signature: ""
      changelog: |
        - First release
